<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <!-- Настроил правильное отображение страницы на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Добавил описание страницы для поисковых систем -->
    <meta name="description" content="Форма обратной связи">

    <!-- Указал название страницы во вкладке браузера -->
    <title>Форма обратной связи</title>

    <!-- Подключил файл со стилями CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Основной блок главной страницы -->
    <main class="main">

        <!-- Заголовок и приветственный текст -->
        <h1>Добро пожаловать!</h1>
        <p>Если у вас есть вопросы, свяжитесь с нами.</p>

        <!-- Кнопка для открытия формы обратной связи -->
        <button class="open-btn" id="openForm">
            Обратная связь
        </button>
    </main>

    <!-- Всплывающее окно с формой обратной связи -->
    <div class="popup" id="popup" aria-hidden="true">

        <!-- Основное содержимое всплывающего окна -->
        <div class="popup-content"
             role="dialog"
             aria-modal="true"
             aria-labelledby="formTitle">

            <!-- Кнопка для закрытия всплывающего окна -->
            <button class="close-btn"
                    id="closeForm"
                    type="button"
                    aria-label="Закрыть форму">
                &times;
            </button>

            <!-- Заголовок формы -->
            <h2 id="formTitle">Обратная связь</h2>

            <!-- Форма для заполнения контактных данных -->
            <form id="feedbackForm">

                <!-- Поле для ввода фамилии, имени и отчества -->
                <label for="fio">ФИО</label>
                <input
                    type="text"
                    id="fio"
                    name="fio"
                    placeholder="Введите ваше ФИО"
                    required
                >

                <!-- Поле для ввода электронной почты -->
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@mail.ru"
                    required
                >

                <!-- Поле для ввода номера телефона -->
                <label for="phone">Телефон</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+7 (999) 123-45-67"
                    required
                >

                <!-- Необязательное поле для названия организации -->
                <label for="organization">Организация</label>
                <input
                    type="text"
                    id="organization"
                    name="organization"
                    placeholder="Название организации"
                >

                <!-- Поле для ввода текста сообщения -->
                <label for="message">Сообщение</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Введите ваше сообщение"
                    required
                ></textarea>

                <!-- Блок согласия на обработку персональных данных -->
                <div class="agreement">

                    <!-- Обязательный чекбокс для подтверждения согласия -->
                    <input
                        type="checkbox"
                        id="agreement"
                        name="agreement"
                        required
                    >

                    <!-- Текст согласия, связанный с чекбоксом -->
                    <label for="agreement">
                        Я согласен(на) с политикой обработки
                        персональных данных
                    </label>
                </div>

                <!-- Кнопка для отправки заполненной формы -->
                <button type="submit" id="submitBtn">
                    Отправить
                </button>

                <!-- Блок для отображения результата отправки формы -->
                <!-- role и aria-live помогают озвучивать сообщения программам чтения с экрана -->
                <div id="status" role="status"
                     aria-live="polite"></div>

            </form>
        </div>
    </div>

    <!-- Подключил JavaScript для обработки действий пользователя -->
    <script src="script.js"></script>
</body>
</html>
